<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>IceCube Event Viewer</title>
<style>
:root{
  --bg:#f2f2f7; --canvas:#eef0f5; --glass:rgba(255,255,255,.72); --glass-strong:rgba(255,255,255,.9);
  --card:rgba(255,255,255,.65); --sep:rgba(60,60,67,.14); --fill:rgba(120,120,128,.14); --fill-2:rgba(120,120,128,.22);
  --text:#1d1d1f; --text-2:rgba(60,60,67,.62); --text-3:rgba(60,60,67,.38);
  --blue:#007aff; --green:#34c759; --orange:#ff9500; --pink:#ff2d55; --red:#ff3b30; --grey:#8e8e93;
  --seg-on:#ffffff; --shadow:0 1px 2px rgba(0,0,0,.06),0 8px 30px rgba(0,0,0,.10);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",Helvetica,Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,monospace;
  color-scheme:light dark;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#000; --canvas:#0b0b0f; --glass:rgba(28,28,30,.72); --glass-strong:rgba(44,44,46,.9);
  --card:rgba(44,44,46,.6); --sep:rgba(84,84,88,.6); --fill:rgba(120,120,128,.24); --fill-2:rgba(120,120,128,.36);
  --text:#f5f5f7; --text-2:rgba(235,235,245,.6); --text-3:rgba(235,235,245,.3);
  --blue:#0a84ff; --green:#30d158; --orange:#ff9f0a; --pink:#ff375f; --red:#ff453a; --grey:#98989d;
  --seg-on:#636366; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 30px rgba(0,0,0,.5);
}}
:root[data-theme="dark"]{
  --bg:#000; --canvas:#0b0b0f; --glass:rgba(28,28,30,.72); --glass-strong:rgba(44,44,46,.9);
  --card:rgba(44,44,46,.6); --sep:rgba(84,84,88,.6); --fill:rgba(120,120,128,.24); --fill-2:rgba(120,120,128,.36);
  --text:#f5f5f7; --text-2:rgba(235,235,245,.6); --text-3:rgba(235,235,245,.3);
  --blue:#0a84ff; --green:#30d158; --orange:#ff9f0a; --pink:#ff375f; --red:#ff453a; --grey:#98989d;
  --seg-on:#636366; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 30px rgba(0,0,0,.5);
}
html,body{height:100%;}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:13px;line-height:1.4;overflow:hidden;-webkit-font-smoothing:antialiased;}
*{box-sizing:border-box;}
[hidden]{display:none!important;}
button,input{font:inherit;color:inherit;}
button{-webkit-tap-highlight-color:transparent;}
button:focus-visible,input:focus-visible{outline:2px solid var(--blue);outline-offset:2px;}

.app{position:relative;height:100%;width:100%;}
.stage{position:absolute;inset:0;background:var(--canvas);}
.stage canvas{display:block;width:100%;height:100%;}

/* floating glass panel */
.panel{position:absolute;top:14px;right:14px;width:296px;max-height:calc(100% - 28px);overflow-y:auto;background:var(--glass);backdrop-filter:saturate(180%) blur(22px);-webkit-backdrop-filter:saturate(180%) blur(22px);border-radius:16px;box-shadow:var(--shadow);padding:18px 16px;display:flex;flex-direction:column;gap:16px;}
.panel::-webkit-scrollbar{width:4px;}
.panel::-webkit-scrollbar-thumb{background:var(--fill-2);border-radius:4px;}
.panel > *{flex-shrink:0;}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:10px;}
.badge{font-size:10px;color:var(--text-2);background:var(--fill);border-radius:5px;padding:3px 6px;}
.options{border-top:1px solid var(--sep);padding-top:12px;}
.options h2{margin:0;font-size:12px;font-weight:500;color:var(--text-2);}
.option-body{display:flex;flex-direction:column;gap:14px;padding-top:14px;}
.mini-legend{display:flex;align-items:center;justify-content:space-between;gap:6px;font-size:11px;color:var(--text-2);}

h1{margin:0;font-size:17px;font-weight:600;letter-spacing:-.01em;}
.sec{display:flex;flex-direction:column;gap:7px;}
.lab{display:flex;justify-content:space-between;align-items:baseline;padding:0 4px;font-size:12px;color:var(--text-2);font-weight:500;letter-spacing:.01em;}
.lab .val{font-family:var(--mono);font-size:12.5px;color:var(--text);text-transform:none;letter-spacing:0;font-variant-numeric:tabular-nums;font-weight:500;}

/* segmented control */
.seg{display:flex;background:var(--fill);border-radius:9px;padding:2px;gap:2px;}
.seg button{flex:1;border:0;background:transparent;border-radius:7px;padding:5px 6px;font-size:13px;font-weight:500;color:var(--text);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;transition:background .15s;}
.seg button i{font-style:normal;}
.seg button sub{font-size:.7em;line-height:0;}
.seg button .dot{width:7px;height:7px;border-radius:50%;background:var(--c);flex:none;}
.seg button[aria-pressed="true"]{background:var(--seg-on);box-shadow:0 1px 3px rgba(0,0,0,.12),0 0 0 .5px rgba(0,0,0,.04);}
.seg[aria-disabled="true"]{opacity:.4;pointer-events:none;}

/* grouped list */
.list{background:var(--card);border-radius:12px;overflow:hidden;}
.row{display:flex;align-items:center;gap:10px;padding:7px 10px;min-height:38px;}
.row + .row{border-top:.5px solid var(--sep);}
.row .t{flex:1;}
.row .sw{width:9px;height:9px;border-radius:50%;flex:none;}

/* iOS switch */
.switch{position:relative;width:42px;height:26px;flex:none;}
.switch input{position:absolute;inset:0;margin:0;opacity:0;cursor:pointer;}
.switch span{position:absolute;inset:0;pointer-events:none;border-radius:13px;background:var(--fill-2);transition:background .2s;}
.switch span::after{content:"";position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.25),0 0 0 .5px rgba(0,0,0,.05);transition:transform .2s;}
.switch input:checked + span{background:var(--green);}
.switch input:checked + span::after{transform:translateX(16px);}
.switch input:focus-visible + span{outline:2px solid var(--blue);outline-offset:2px;}

/* sliders */
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:22px;background:transparent;margin:0;}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:var(--fill-2);}
input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:var(--fill-2);}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:#fff;margin-top:-8px;box-shadow:0 1px 4px rgba(0,0,0,.25),0 0 0 .5px rgba(0,0,0,.08);}
input[type=range]::-moz-range-thumb{width:20px;height:20px;border:0;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.25);}
.ticks{display:flex;justify-content:space-between;font-size:10.5px;color:var(--text-3);padding:0 4px;margin-top:-4px;}

.seedfield{width:78px;border:0;background:var(--fill);border-radius:7px;padding:5px 8px;font-family:var(--mono);font-size:12.5px;text-align:right;color:var(--text);}
.btn{border:0;background:var(--blue);color:#fff;border-radius:10px;padding:10px 14px;font-size:14px;font-weight:600;cursor:pointer;width:100%;}
.btn:active{filter:brightness(.9);}

.status{display:flex;flex-direction:column;gap:5px;padding:10px 12px;background:var(--card);border-radius:12px;}
.status .big{font-weight:600;font-size:15px;font-variant-numeric:tabular-nums;}
.status p{margin:0;color:var(--text-2);font-size:12px;}
.status p.warn{color:var(--red);}

/* stage overlays */
.playbar{position:absolute;left:18px;bottom:16px;width:min(560px,calc(100% - 346px));display:flex;align-items:center;gap:10px;background:var(--glass);backdrop-filter:saturate(180%) blur(22px);-webkit-backdrop-filter:saturate(180%) blur(22px);border-radius:14px;box-shadow:var(--shadow);padding:8px 12px 8px 8px;}
.playbar button{border:0;background:var(--blue);color:#fff;border-radius:50%;width:32px;height:32px;cursor:pointer;flex:none;display:grid;place-items:center;font-size:13px;}
.playbar input{flex:1;}
.playbar .tt{font-family:var(--mono);font-size:11.5px;color:var(--text-2);min-width:96px;text-align:right;font-variant-numeric:tabular-nums;}
.playbar .cb{width:64px;height:6px;border-radius:3px;background:linear-gradient(90deg,#ff3b30,#ffcc00,#34c759,#007aff);flex:none;}

@media (max-width:820px){
  body{overflow:auto;}
  .app{height:auto;min-height:100%;display:flex;flex-direction:column;}
  .stage{position:relative;height:56vh;min-height:340px;flex:none;}
  .panel{position:static;width:auto;max-height:none;border-radius:0;box-shadow:none;background:var(--bg);backdrop-filter:none;-webkit-backdrop-filter:none;padding:16px 16px 28px;overflow:visible;}
  .playbar{width:calc(100% - 36px);}
  .playbar .cb{width:40px;}
}
@media (prefers-reduced-motion:reduce){ .switch span,.switch span::after,.seg button{transition:none;} }
</style>
</head>
<body>

<div class="app">
  <div class="stage" id="stage">
    <canvas id="c" aria-label="Interactive IceCube event" title="Drag to rotate · Scroll to zoom"></canvas>
    <div class="playbar">
      <button id="play" aria-label="Play / pause">▶</button>
      <input type="range" id="tslider" min="0" max="1000" value="0" aria-label="Event time">
      <span class="tt" id="tlabel">0 ns</span>
      <span class="cb" title="Hit time: early → late" role="img" aria-label="Red: early hits. Blue: late hits."></span>
    </div>
  </div>

  <aside class="panel" aria-label="Event controls">
    <div class="panel-head"><h1>IceCube</h1><span class="badge">Toy model</span></div>

    <div class="seg" id="seg-view" role="group" aria-label="View">
      <button data-v="earth" aria-pressed="true">Earth</button>
      <button data-v="det" aria-pressed="false">Detector</button>
    </div>

    <div class="sec">
      <div class="lab"><span>Particle</span></div>
      <div class="seg" id="seg-particle" role="group" aria-label="Particle">
        <button data-v="atmmu" aria-label="Atmospheric muon" aria-pressed="false" title="Atmospheric muon" style="--c:var(--orange)"><span class="dot"></span>μ</button>
        <button data-v="nue" aria-label="Electron neutrino" aria-pressed="false" style="--c:var(--green)"><span class="dot"></span><i>ν<sub>e</sub></i></button>
        <button data-v="numu" aria-label="Muon neutrino" style="--c:var(--orange)" aria-pressed="true"><span class="dot"></span><i>ν<sub>μ</sub></i></button>
        <button data-v="nutau" aria-label="Tau neutrino" aria-pressed="false" style="--c:var(--pink)"><span class="dot"></span><i>ν<sub>τ</sub></i></button>
        <button data-v="noise" aria-pressed="false">Noise</button>
      </div>
      <div class="seg" id="seg-int" role="group" aria-label="Interaction">
        <button data-v="cc" aria-pressed="true" aria-label="Charged current" title="Charged current">CC</button>
        <button data-v="nc" aria-pressed="false" aria-label="Neutral current" title="Neutral current">NC</button>
      </div>
    </div>

    <div class="sec">
      <div class="lab"><span>Energy</span><span class="val" id="e-val">100 GeV</span></div>
      <input type="range" id="e-slider" min="0" max="3000" value="2000" aria-label="Energy (log scale)">
      <div class="ticks"><span>1 GeV</span><span>10</span><span>100</span><span>1 TeV</span></div>
    </div>

    <div class="sec">
      <div class="lab"><span>Zenith</span><span class="val" id="z-val">60°</span></div>
      <input type="range" id="z-slider" min="0" max="180" value="60" aria-label="Zenith angle">
      <div class="ticks"><span>Sky</span><span>Horizon</span><span>Earth</span></div>
    </div>

    <div class="sec">
      <div class="lab"><span>Detector</span></div>
      <div class="list">
        <label class="row"><span class="sw" style="background:#5b7ea8"></span><span class="t">IceCube</span><span class="switch"><input type="checkbox" id="det-ic" checked><span></span></span></label>
        <label class="row"><span class="sw" style="background:#3aa5d8"></span><span class="t">DeepCore</span><span class="switch"><input type="checkbox" id="det-dc"><span></span></span></label>
        <label class="row"><span class="sw" style="background:#d9902b"></span><span class="t">Upgrade</span><span class="switch"><input type="checkbox" id="det-up"><span></span></span></label>
      </div>
    </div>

    <button class="btn" id="new-ev">New event</button>

    <div class="status" aria-live="polite" aria-atomic="true">
      <div class="big" id="s-hits">—</div>
      <p id="s-what"></p>
      <p id="s-note" class="warn" hidden></p>
    </div>

    <section class="options" aria-labelledby="options-title">
      <h2 id="options-title">Options</h2>
      <div class="option-body">
        <div class="sec">
          <div class="lab"><span>Vertex</span></div>
          <div class="seg" id="seg-vtx" role="group" aria-label="Vertex region">
            <button data-v="outside" aria-pressed="true">Outer array</button>
            <button data-v="infill" aria-pressed="false">Dense core</button>
          </div>
        </div>
        <div class="list">
          <label class="row"><span class="t">Dust layer</span><span class="switch"><input type="checkbox" id="opt-dust" checked><span></span></span></label>
          <label class="row"><span class="t">Noise</span><span class="switch"><input type="checkbox" id="opt-noise" checked><span></span></span></label>
          <label class="row"><span class="t">Seed</span><input class="seedfield" type="number" id="seed" min="0" max="999999" step="1" value="1" aria-label="Random seed" title="Same seed and settings reproduce the event"></label>
        </div>
        <div class="mini-legend"><span>Dashed: ν · Solid: e / μ / τ</span></div>
      </div>
    </section>
  </aside>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.152.2/three.min.js"></script>

  const q = (arr, p) => arr.length ? arr[Math.min(arr.length - 1, Math.floor(p * arr.length))] : 0;
  hitVis.cmin = q(ref, 0.02); hitVis.cmax = Math.max(hitVis.cmin + 200, q(ref, 0.98));
  hitMesh.count = Math.min(ev.hits.length, MAX_HITS);
  ev.hits.forEach((h, i) => { if (i >= MAX_HITS) return; const f = Math.max(0, Math.min(1, (h.t - hitVis.cmin) / (hitVis.cmax - hitVis.cmin))); tmpColor.setHSL(0.68 * f, 0.95, 0.55); hitMesh.instanceColor.setXYZ(i, tmpColor.r, tmpColor.g, tmpColor.b); h.r = h.noise ? 5 : 9 + 13 * Math.log10(1 + h.q); });
  hitMesh.instanceColor.needsUpdate = true;
  buildActors();
  // playback speed: whole event in 10 s of wall time
  ev.tA = Math.max(ev.t0, Math.min(T_APPROACH, ev.hits.length ? ev.hits[0].t - 500 : T_APPROACH));
  clock.f = reduceMotion ? 1 : 0; clock.playing = !reduceMotion; clock.wall = performance.now();
  updateStatus(); render(true);
}

function render(force) {
  const t = simFromFrac(clock.f);
  // hits
  for (let i = 0; i < hitMesh.count; i++) { const h = ev.hits[i], s = h.t <= t ? h.r : 0; dummy.position.set(h.sn.x, h.sn.y, h.sn.z); dummy.scale.setScalar(s); dummy.updateMatrix(); hitMesh.setMatrixAt(i, dummy.matrix); }
  hitMesh.instanceMatrix.needsUpdate = true;
  // particles
  for (const a of actors) {
    if (a.p) {
      const p = a.p, s = Math.max(0, Math.min(p.length, (t - p.t0) * (p.speed || C))), started = t >= p.t0, done = s >= p.length;
      const hx = p.start.x + p.dir.x * s, hy = p.start.y + p.dir.y * s, hz = p.start.z + p.dir.z * s;
      const pos = a.line.geometry.attributes.position; pos.setXYZ(1, hx, hy, hz); pos.needsUpdate = true;
      if (a.line.material.isLineDashedMaterial) a.line.computeLineDistances();
      a.line.visible = started && s > 0;
      a.head.visible = started && (!done || !!p.absorbed);
      a.head.position.set(hx, hy, hz);
      a.label.visible = started && (!done || p.absorbed);
      a.label.position.set(hx, hy, hz);
      if (a.line.material.isLineDashedMaterial) { a.line.material.dashSize = orbit.radius * 0.012; a.line.material.gapSize = orbit.radius * 0.008; }
    } else {
      a.mesh.visible = t >= a.casc.t0;
    }
  }
  document.getElementById('tslider').value = Math.round(clock.f * 1000);
  document.getElementById('tlabel').textContent = fmtT(t);
}

/* ------------------------------------------------------------ UI */
const $ = id => document.getElementById(id);
const fmtE = E => E >= 1000 ? (E / 1000).toFixed(2).replace(/\.?0+$/, '') + ' TeV' : E >= 100 ? Math.round(E) + ' GeV' : E >= 10 ? E.toFixed(1) + ' GeV' : E.toFixed(2) + ' GeV';
const fmtN = n => Math.round(n).toLocaleString();
function updateStatus() {
  const nSens = new Set(ev.hits.map(h => h.sn)).size, Q = ev.hits.reduce((a, h) => a + h.q, 0);
  $('s-hits').textContent = nSens ? `${fmtN(nSens)} sensors · ${fmtN(Q)} p.e.` : 'No hits';
  const flavor = FLAV[ev.type.slice(0, -2)];
  const topology = ev.tracks.length ? 'track' + (ev.cascades.length ? ' + cascade' : '') : 'cascade';
  $('s-what').textContent = ev.type === 'noise' ? 'Detector noise'
    : ev.type === 'atmmu' ? 'Atmospheric μ'
    : `${NU_LABEL[flavor]} ${ev.type.endsWith('nc') ? 'NC' : 'CC'}${ev.forbidden ? '' : ' · ' + topology}`;
  let note = '';
  if (ev.forbidden) note = `Tau CC needs ≥ ${TAU_THRESHOLD.toFixed(2)} GeV.`;
  else if (ev.absorbed) note = 'Muon absorbed before reaching IceCube.';
  else if (!Object.values(state.det).some(Boolean)) note = 'Select a detector to see hits.';
  else if (ev.warn && ev.hits.filter(h => !h.noise).length < 6) note = 'Few signal hits at this setting.';
  const n = $('s-note'); n.hidden = !note; n.textContent = note;
}
function updateZen() { $('z-val').textContent = state.zen + '°'; }
function updateDet() { SUBS.forEach(s => { subGroups[s].visible = state.det[s]; }); }
let simTimer = null; const resim = (delay = 0) => { clearTimeout(simTimer); simTimer = setTimeout(buildEvent, delay); };

$('e-slider').addEventListener('input', e => { state.E = Math.pow(10, +e.target.value / 1000); $('e-val').textContent = fmtE(state.E); resim(150); });
$('z-slider').addEventListener('input', e => { state.zen = +e.target.value; updateZen(); resim(150); });
function segment(id, onPick) { const seg = $(id); seg.querySelectorAll('button').forEach(b => b.addEventListener('click', () => { seg.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b ? 'true' : 'false')); onPick(b.dataset.v); })); }
function syncType() { const p = state.particle; state.type = (p === 'atmmu' || p === 'noise') ? p : p + state.inter; $('seg-int').hidden = p === 'atmmu' || p === 'noise'; }
segment('seg-particle', v => { state.particle = v; syncType(); updateZen(); resim(); });
segment('seg-int', v => { state.inter = v; syncType(); resim(); });
segment('seg-vtx', v => { state.vtx = v; resim(); });
[['det-ic', 'IceCube'], ['det-dc', 'DeepCore'], ['det-up', 'Upgrade']].forEach(([id, sub]) => $(id).addEventListener('change', e => { state.det[sub] = e.target.checked; updateDet(); resim(); }));
$('opt-dust').addEventListener('change', e => { state.dust = e.target.checked; updateGeology(); resim(); });
$('opt-noise').addEventListener('change', e => { state.noise = e.target.checked; resim(); });
$('new-ev').addEventListener('click', () => { state.seed = Math.floor(Math.random() * 1e6); $('seed').value = state.seed; buildEvent(); });
$('seed').addEventListener('input', e => { const n = parseInt(e.target.value, 10); if (!isNaN(n)) { state.seed = Math.max(0, n); resim(150); } });
$('play').addEventListener('click', () => { if (clock.playing) clock.playing = false; else { if (clock.f >= 1) clock.f = 0; clock.playing = true; clock.wall = performance.now(); } });
$('tslider').addEventListener('input', e => { clock.playing = false; clock.f = +e.target.value / 1000; render(); });
segment('seg-view', v => orbit.flyTo(v === 'earth' ? R_EARTH : R_DET));

function resize() { const w = stage.clientWidth, h = stage.clientHeight; if (!w || !h) return; renderer.setSize(w, h, false); cam.aspect = w / h; cam.updateProjectionMatrix(); }
new ResizeObserver(resize).observe(stage); resize();

function frame(now) {
  requestAnimationFrame(frame);
  if (clock.playing) { clock.f = Math.min(1, clock.f + (now - clock.wall) / 10000); if (clock.f >= 1) clock.playing = false; render(); }
  if (staticLabels.mark) staticLabels.mark.visible = orbit.radius > 4e4;
  clock.wall = now;
  $('play').textContent = clock.playing ? '❙❙' : (clock.f >= 1 ? '↻' : '▶');
  orbit.update(); updateGeology(); renderer.render(scene, cam);
}

const staticLabels = new THREE.Group(); scene.add(staticLabels);
function buildStaticLabels() {
  clearOwnedGroup(staticLabels);
  const poleLabel = textSprite('IceCube · South Pole', { color: THEME.labelStrong, size: 30, px: 13 }); poleLabel.position.set(0, 0, SURFACE_Z); poleLabel.center.set(0.5, -0.4); staticLabels.add(poleLabel);
  const mark = dotSprite(0x0a84ff, 7); mark.position.set(0, 0, 0); staticLabels.add(mark); staticLabels.mark = mark;
  const nLabel = textSprite('North Pole', { px: 12, depth: true }); nLabel.position.set(0, 0, EARTH_C.z - EARTH_R * 1.002); nLabel.center.set(0.5, 1.3); staticLabels.add(nLabel);
  const eqLabel = textSprite('equator', { px: 12, depth: true }); eqLabel.position.set(EARTH_R * 1.002, 0, EARTH_C.z); eqLabel.center.set(-0.1, 0.5); staticLabels.add(eqLabel);
}
function applyTheme() {
  THEME = isDark() ? THEMES.dark : THEMES.light;
  renderer.setClearColor(THEME.bg, 1);
  globe.material.color.setHex(THEME.globe); globe.material.opacity = THEME.globeOp;
  cap.material.color.setHex(THEME.cap); cap.material.opacity = THEME.capOp;
  gratMat.color.setHex(THEME.grat); gratMat.opacity = THEME.gratOp; eqMat.color.setHex(THEME.eq); eqMat.opacity = THEME.eqOp;
  SUBS.forEach(s => { subMats[s].mesh.color.setHex(THEME.sub[s]); subMats[s].mesh.opacity = THEME.sensOp; subMats[s].line.color.setHex(THEME.sub[s]); subMats[s].line.opacity = THEME.strOp; });
  const dark = isDark();
  const layerColors = dark ? { ice: 0x7cbfe3, surface: 0xc2e8f5, rock: 0x998473, dust: 0xc8a477 }
    : { ice: 0x438aaf, surface: 0xc0e2ef, rock: 0x857364, dust: 0x977347 };
  geologyMaterials.forEach(({ material, role }) => material.color.setHex(layerColors[role]));
  buildStaticLabels(); buildGeologyLabels(); updateGeology();
  if (ev) buildActors(), render();
}
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme);
new MutationObserver(applyTheme).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

function boot() {
  applyTheme();
  $('e-val').textContent = fmtE(state.E); updateZen(); updateDet(); buildEvent();
  requestAnimationFrame(frame);
}
boot();
</script>

</body>
</html>
